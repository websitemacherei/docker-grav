name: Build Grav image

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Grav tag to build (optional, overrides latest)'
        required: false

env:
  IMAGE: websitemacherei/grav

jobs:
  check:
    runs-on: self-hosted 
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_latest: ${{ steps.v.outputs.is_latest }}
      needs_build: ${{ steps.check.outputs.needs_build }}
    steps:
      - id: v
        run: |
          LATEST=$(git ls-remote --tags --refs --sort=-v:refname \
                     https://github.com/getgrav/grav.git \
                   | head -1 | sed 's#.*/##')
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
            if ! git ls-remote --tags --refs \
                   https://github.com/getgrav/grav.git "refs/tags/$V" | grep -q .; then
              echo "::error::Tag '$V' not found in getgrav/grav"
              exit 1
            fi
          else
            V="$LATEST"
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          if [ "$V" = "$LATEST" ]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - id: check
        run: |
          # a manually requested tag is always built, even if it already exists
          if [ -n "${{ inputs.version }}" ]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          V="${{ steps.v.outputs.version }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${V}/")
          if [ "$CODE" = "200" ]; then
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${{ needs.check.outputs.version }}"
            if [ "${{ needs.check.outputs.is_latest }}" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GRAV_VERSION=${{ needs.check.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max